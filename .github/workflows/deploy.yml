name: Update scores and deploy

# Runs hourly on Saturdays and Sunday morning Mountain Time, on every push to main, and manually. A step inside gates the refresh so late Saturday games are included before the weekly email.

on:
  schedule:
    - cron: '0 * * * 6'     # every hour, Saturday (UTC)
    - cron: '0 0-8 * * 0'   # Saturday night Mountain (= Sun 00-08 UTC)
    - cron: '0 9-11 * * 0'  # Sunday morning Mountain: late games can finish after 11pm MT
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate refresh to game window
        id: window
        run: |
          RUN_TYPE="${{ github.event_name }}"
          MT=$(TZ=America/Denver date +'%u %H')
          day=${MT%% *}; hour=${MT##* }
          skip=false
          if [ "$RUN_TYPE" = "push" ] || [ "$RUN_TYPE" = "workflow_dispatch" ]; then
            echo "Manual/push run — deploying."
          elif [ "$day" = "6" ] && { [ "$hour" -lt 10 ] || [ "$hour" -gt 23 ]; }; then
            echo "Outside Saturday 10am-11pm Mountain window — skipping this scheduled run (no deploy)."
            skip=true
          elif [ "$day" != "6" ] && { [ "$day" != "7" ] || [ "$hour" -gt 11 ]; }; then
            echo "Outside Sunday midnight-noon Mountain catch-up window — skipping this scheduled run (no deploy)."
            skip=true
          else
            echo "Within refresh window — refreshing."
          fi
          echo "skipped=$skip" >> "$GITHUB_OUTPUT"

      - name: Refresh scores from ESPN
        if: steps.window.outputs.skipped != 'true'
        run: python3 fetch_scores.py --out data.json

      - name: Setup Pages
        if: steps.window.outputs.skipped != 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.window.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.window.outputs.skipped != 'true'
        id: deployment
        uses: actions/deploy-pages@v4